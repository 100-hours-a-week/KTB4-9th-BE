name: Stage Backend CD

on:
  pull_request:
    branches: [stage]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: stage-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy merged PR image to staging ECS
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify deployment configuration
        env:
          AWS_STAGE_CD_ROLE_ARN: ${{ vars.AWS_STAGE_CD_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in AWS_REGION ECR_REPOSITORY AWS_STAGE_CD_ROLE_ARN AWS_ACCOUNT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required staging Environment variable: ${name}"
              exit 1
            fi
          done
          if [[ ! "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid PR head SHA: ${IMAGE_TAG}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGE_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Deploy immutable image to ECS
        run: |
          bash .github/scripts/deploy-ecs-image.sh \
            cosmos-v2-stage-cluster \
            cosmos-v2-stage-spring \
            cosmos-v2-stage-spring \
            spring \
            "${ECR_REPOSITORY}" \
            "${IMAGE_TAG}" \
            "${AWS_REGION}"

      - name: Verify ECS deployment and ALB target health
        run: |
          set -euo pipefail

          cluster="cosmos-v2-stage-cluster"
          service="cosmos-v2-stage-spring"

          rollout_state="$(aws ecs describe-services \
            --cluster "${cluster}" \
            --services "${service}" \
            --region "${AWS_REGION}" \
            --query 'services[0].deployments[?status==`PRIMARY`].rolloutState | [0]' \
            --output text)"

          if [[ "${rollout_state}" != "COMPLETED" ]]; then
            echo "::error::ECS deployment did not complete: ${rollout_state}"
            aws ecs describe-services \
              --cluster "${cluster}" \
              --services "${service}" \
              --region "${AWS_REGION}" \
              --query 'services[0].{desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount,deployments:deployments,events:events[0:10]}' \
              --output json
            exit 1
          fi

          target_group_arn="$(aws ecs describe-services \
            --cluster "${cluster}" \
            --services "${service}" \
            --region "${AWS_REGION}" \
            --query 'services[0].loadBalancers[?containerName==`spring`].targetGroupArn | [0]' \
            --output text)"

          if [[ -z "${target_group_arn}" || "${target_group_arn}" == "None" ]]; then
            echo "::error::Spring target group could not be resolved from the ECS service."
            exit 1
          fi

          target_states="$(aws elbv2 describe-target-health \
            --target-group-arn "${target_group_arn}" \
            --region "${AWS_REGION}" \
            --query 'TargetHealthDescriptions[].TargetHealth.State' \
            --output text)"

          if [[ -z "${target_states}" || " ${target_states} " == *" unhealthy "* || " ${target_states} " == *" initial "* || " ${target_states} " == *" draining "* || " ${target_states} " == *" unused "* || " ${target_states} " == *" unavailable "* ]]; then
            echo "::error::Spring ALB targets are not all healthy: ${target_states:-none}"
            aws elbv2 describe-target-health \
              --target-group-arn "${target_group_arn}" \
              --region "${AWS_REGION}" \
              --output json
            exit 1
          fi

          echo "ECS deployment completed and ALB targets are healthy: ${target_states}"
