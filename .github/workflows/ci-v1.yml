name: ci-v1.yml

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - dev
  workflow_dispatch: # 👈 웹 화면에서 수동 실행(Run workflow) 가능하도록 추가

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and verify Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Verify Docker image build
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "cosmos-backend:${IMAGE_TAG}" \
            .

      - name: Export deployment image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker save \
            --output "${RUNNER_TEMP}/backend-image.tar" \
            "cosmos-backend:${IMAGE_TAG}"

      - name: Upload deployment image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: ${{ runner.temp }}/backend-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
