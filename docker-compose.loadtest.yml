# 로컬 부하테스트용 자원 제한 설정
# compose.yml과 함께 사용
# 백엔드·MySQL 각 CPU 2개, 메모리 4GB 제한
services:
  mysql:
    # 부하테스트용 MySQL 자원 제한
    cpus: 2.0
    mem_limit: 4g
    # MySQL 준비 상태 확인
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 로컬 백엔드 부하테스트 설정
  backend-loadtest:
    # Java 25 실행 이미지
    image: eclipse-temurin:25-jdk-alpine
    working_dir: /workspace
    # Pyroscope 프로파일링 활성화 후 Spring Boot 실행
    command: ["./gradlew", "bootRun", "-Ppyroscope=true", "--no-daemon"]
    # 부하테스트용 백엔드 자원 제한
    cpus: 2.0
    mem_limit: 4g
    # API·Actuator 접속 포트
    ports:
      - "8080:8080"
    # 프로젝트 소스·Gradle 캐시 연결
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    # 로컬 프로파일·DB·외부 연동 환경변수
    # 비밀값은 셸 환경변수로 전달
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cosmos
      SPRING_DATASOURCE_USERNAME: cosmos
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your shell}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your shell}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?Set KAKAO_CLIENT_ID in your shell}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?Set KAKAO_CLIENT_SECRET in your shell}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?Set KAKAO_REDIRECT_URI in your shell}
      # 호스트 AI 서버·Pyroscope 접속 주소
      AI_BASE_URL: http://host.docker.internal:8000
      PYROSCOPE_SERVER_ADDRESS: http://host.docker.internal:4040
    # MySQL 준비 후 백엔드 실행
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  # Gradle 의존성 캐시 볼륨
  gradle-cache:
