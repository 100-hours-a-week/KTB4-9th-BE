# Prometheus 기본 수집·평가 간격
global:
  # 메트릭 수집 간격
  scrape_interval: 2s
  # 규칙 평가 간격
  evaluation_interval: 2s

# Prometheus 수집 대상
scrape_configs:
  # COSMOS Spring 백엔드 지표
  - job_name: prometheus.scrape.spring
    # Actuator Prometheus 엔드포인트 경로
    metrics_path: /actuator/prometheus
    static_configs:
      # 호스트 백엔드 주소·포트
      - targets:
          - host.docker.internal:8080
        labels:
          application: cosmos-backend
          version: v1

  # 로컬 MySQL·백엔드 컨테이너 자원 지표
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  # Docker API 기반 MySQL 컨테이너 CPU 지표
  - job_name: docker-metrics
    static_configs:
      - targets:
          - docker-metrics:9273
