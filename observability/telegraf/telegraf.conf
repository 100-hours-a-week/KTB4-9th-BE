[agent]
  interval = "1s"
  flush_interval = "1s"
  omit_hostname = true

# Docker API에서 MySQL 컨테이너의 실제 CPU 사용률을 수집한다.
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_name_include = ["cosmos-mysql"]
  container_state_include = ["running"]
  perdevice_include = []
  total_include = ["cpu"]

# MySQL 자체 상태값에서 연결 수와 InnoDB 행 잠금 대기를 수집한다.
[[inputs.mysql]]
  servers = ["${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/?tls=false"]
  metric_version = 2
  gather_innodb_metrics = true
  gather_process_list = false
  gather_table_io_waits = false
  gather_table_lock_waits = false
  gather_index_io_waits = false

# Prometheus가 수집할 메트릭 엔드포인트를 제공한다.
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
