services:
  mysql:
    image: mysql:8.4
    container_name: cosmos-mysql
    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: cosmos
      MYSQL_USER: cosmos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: