spring:
  application:
    name: cosmos-backend
  jpa:
    open-in-view: true

battle:
  schedule:
    open-time: ${BATTLE_OPEN_TIME:12:50:00}
    submission-deadline: ${BATTLE_SUBMISSION_DEADLINE:12:59:59}
    result-time: ${BATTLE_RESULT_TIME:13:00:00}

ai:
  server:
    connect-timeout: ${AI_SERVER_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_SERVER_READ_TIMEOUT:30s}

evaluation:
  worker:
    enabled: ${EVALUATION_WORKER_ENABLED:true}
    poll-interval: ${EVALUATION_WORKER_POLL_INTERVAL:5s}
    concurrency: ${EVALUATION_WORKER_CONCURRENCY:2}
    max-attempts: ${EVALUATION_WORKER_MAX_ATTEMPTS:3}
    retry-delay: ${EVALUATION_WORKER_RETRY_DELAY:15s}
    stuck-after: ${EVALUATION_WORKER_STUCK_AFTER:2m}
    recovery-interval: ${EVALUATION_WORKER_RECOVERY_INTERVAL:30s}

judge0:
  connect-timeout: ${JUDGE0_CONNECT_TIMEOUT:3s}
  read-timeout: ${JUDGE0_READ_TIMEOUT:10s}
  poll-interval: ${JUDGE0_POLL_INTERVAL:1s}
  max-wait: ${JUDGE0_MAX_WAIT:30s}
  batch-size: 20
  max-memory-kb: 512000
  language-ids:
    PYTHON: 71
    JAVASCRIPT: 63
    JAVA: 62
    CPP: 54

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: dev | stage
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${ACCESS_TOKEN_EXP:1800}
  refresh-token-expiration: ${REFRESH_TOKEN_EXP:1209600}

cookie:
  secure: true

ai:
  root-url: ${AI_SERVER_BASE_URL}
  server:
    base-url: ${AI_SERVER_BASE_URL}

judge0:
  base-url: ${JUDGE0_BASE_URL}

server:
  servlet:
    context-path: /api
  # 부하테스트를 위한 메트릭
  tomcat:
    mbeanregistry:
      enabled: true

# 부하테스트를 위한 메트릭
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
        jvm.gc.pause: true

frontend:
  base-url: ${FRONTEND_BASE_URL}
