spring:
  jpa:
    hibernate:
      ddl-auto: update
  task:
    scheduling:
      pool:
        size: 3

ai:
  root-url: ${AI_SERVER_BASE_URL:http://ai-server:8000}
  server:
    base-url: ${AI_SERVER_BASE_URL:http://ai-server:8000}

judge0:
  base-url: ${JUDGE0_BASE_URL:https://dev-judge.cosmoscode.site}

sentry:
  environment: ${SENTRY_ENVIRONMENT:dev}

frontend:
  base-url: ${FRONTEND_BASE_URL:https://cosmoscode.site}

# 개발 서버에서 명시적으로 활성화한 경우에만 부하 테스트 사용자를 준비한다.
loadtest:
  fixtures:
    enabled: ${LOADTEST_FIXTURES_ENABLED:false}
    secret: ${LOADTEST_FIXTURES_SECRET:}
