spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cosmos
    username: cosmos
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  task:
    scheduling:
      pool:
        size: 3

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    virtual-host: ${RABBITMQ_DEFAULT_VHOST:/}
    listener:
      simple:
        # 동시에 메시지를 처리할 Consumer 개수
        concurrency: ${RABBITMQ_CONSUMER_CONCURRENCY:1}
        max-concurrency: ${RABBITMQ_CONSUMER_CONCURRENCY:1}
        # Worker가 ACK하기 전에 미리 받아둘 메시지를 1개로 제한
        prefetch: ${RABBITMQ_CONSUMER_PREFETCH:1}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:

logging:
  level:
    org.springframework.security.web.FilterChainProxy: INFO

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800
  refresh-token-expiration: 1209600

frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

cookie:
  secure: false

ai:
  root-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}

judge0:
  base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
