plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cosmos'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	pyroscopeAgent
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	// 헬스체크
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	// Local-profile JDBC query timing observations (disabled outside local profile).
	implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.3.0'

	// 에러 및 성능 모니터링
	implementation 'io.sentry:sentry-spring-boot-4-starter:8.53.0'
	pyroscopeAgent 'io.pyroscope:agent:2.9.1'

	// JWT 생성/검증 및 Resource Server 인증
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// 캐시
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

}

tasks.named('test') {
	useJUnitPlatform()
}

// 로컬 실행에서만 `-Ppyroscope=true`로 켜는 프로파일러입니다.
tasks.named('bootRun') {
	if (providers.gradleProperty('pyroscope').map { it.toBoolean() }.getOrElse(false)) {
		jvmArgs "-javaagent:${configurations.pyroscopeAgent.singleFile}"
		systemProperty 'pyroscope.application.name', 'cosmos-backend-local'
		systemProperty 'pyroscope.server.address', providers.environmentVariable('PYROSCOPE_SERVER_ADDRESS').getOrElse('http://localhost:4040')
		systemProperty 'pyroscope.format', 'jfr'
		systemProperty 'pyroscope.profiler.event', providers.environmentVariable('PYROSCOPE_PROFILER_EVENT').getOrElse('itimer')
	}
}
